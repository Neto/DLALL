name: BaixaTudo
options:
  bundleIdPrefix: com.baixatudo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  MARKETING_VERSION: "1.5.2"
  CURRENT_PROJECT_VERSION: "8"
  DEVELOPMENT_TEAM: NDCT2T4D7G
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  BaixaTudo:
    type: application
    platform: macOS
    sources:
      - path: BaixaTudo
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baixatudo.BaixaTudo
        PRODUCT_NAME: BaixaTudo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BaixaTudo
        INFOPLIST_KEY_CFBundleName: BaixaTudo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Spinoff"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "O BaixaTudo usa o Safari só quando você ativa cookies do navegador, para baixar vídeos da sua conta."
        CODE_SIGN_ENTITLEMENTS: BaixaTudo/BaixaTudo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed Helpers
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        path: scripts/embed-helpers.sh
